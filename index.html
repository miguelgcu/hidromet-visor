<!DOCTYPE html>
<html lang="es">
<head>
<script>window.HIDROMET_VISOR=true;/* Proyección pública de solo lectura generada desde ui/. */</script>

<meta charset="utf-8">
<title>HidroMet Ecuador</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1322">
<link rel="icon" href="favicon.png">
<script>try{document.documentElement.dataset.tema=localStorage.getItem("hidromet-tema")||"oscuro"}catch(e){document.documentElement.dataset.tema="oscuro"}</script>
<script>
/* La sidebar colapsada recordada se aplica ANTES de pintar, para que no se vea
   saltar. Aquí había además una cortina de acceso (HM_ACCESO_LIBRE / hm-prelogin):
   se retiró el 2026-09-17 con el gestor de cuentas. Llevaba desactivada desde el
   2026-08-06 y en un sitio estático nunca fue seguridad, solo un estorbo. */
(function(){try{if(localStorage.getItem("hm-sidebar")==="min")document.documentElement.classList.add("hm-sb-min");}catch(e){}})();
</script>
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="lib/leaflet/MarkerCluster.css">
<link rel="stylesheet" href="lib/leaflet/MarkerCluster.Default.css">

<body>
<div id="capa-app">
  <aside id="sidebar">
    <div class="marca">
      <div class="marca-logo">HM</div>
      <div class="marca-texto">
        <span class="marca-nombre">HidroMet</span>
        <span class="marca-sub">Ecuador · Operativo</span>
      </div>
    </div>
    <nav id="nav-principal"></nav>
    <div class="sidebar-pie">
      <div id="tareas-activas"></div>
      <div class="sidebar-estado">
        <span class="punto"></span>
        <div class="et"><b>Sistema autocontenido</b><span>offline</span></div>
      </div>
      <button id="btn-tema" class="boton-fantasma" title="Alternar tema claro / oscuro">◐ Tema</button>
    </div>
  </aside>
  <main id="contenedor-vista">
    <div id="topbar">
      <button id="btn-menu" type="button" aria-label="Abrir menú" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="ruta">
        <span class="actual">Estación de trabajo</span><span class="sep">/</span><span id="topbar-modulo">Pronóstico</span>
      </div>
      <div class="estado">
        <div class="sync"><span class="punto"></span><span id="topbar-sync">Datos locales</span></div>
        <div class="reloj" id="topbar-reloj">—</div>
      </div>
    </div>
    <header id="cabecera-vista">
      <h1 id="titulo-vista">…</h1>
      <div id="acciones-vista"></div>
    </header>
    <section id="vista"></section>
  </main>
  <div id="overlay-nav"></div>
</div>
<div id="avisos"></div>

<script src="lib/leaflet/leaflet.js"></script>

<script src="js/modules/iuv.js?v=8d9752d8d2c9"></script>

<script>App.iniciar();</script>
