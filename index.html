<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>HidroMet Ecuador</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1322">
<link rel="icon" href="favicon.png">
<script>window.HIDROMET_VISOR = true;  /* MODO VISOR: la UI lee productos publicados, sin backend.
   Se fija en <head> para que el guard pre-paint de abajo lo vea de forma SÍNCRONA. */</script>
<script>try{document.documentElement.dataset.tema=localStorage.getItem("hidromet-tema")||"oscuro"}catch(e){document.documentElement.dataset.tema="oscuro"}</script>
<script>
/* P19 — guard SÍNCRONO pre-paint: sin sesión, la app queda oculta ANTES del primer
   pintado (cero parpadeo, también con caché fría). P22 — sidebar colapsada pre-paint. */
(function(){var h=document.documentElement;
try{if(window.HIDROMET_VISOR&&localStorage.getItem("hm-acceso-v1")!=="1"&&sessionStorage.getItem("hm-acceso-v1")!=="1")h.classList.add("hm-prelogin");}
catch(e){if(window.HIDROMET_VISOR)h.classList.add("hm-prelogin");}
try{if(localStorage.getItem("hm-sidebar")==="min")h.classList.add("hm-sb-min");}catch(e){}})();
</script>
<style>html.hm-prelogin #capa-app{visibility:hidden}</style>
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="lib/leaflet/MarkerCluster.css">
<link rel="stylesheet" href="lib/leaflet/MarkerCluster.Default.css">
<link rel="stylesheet" href="css/fonts.css?v=d110156a3798">
<link rel="stylesheet" href="css/base.css?v=d110156a3798">
<link rel="stylesheet" href="css/inicio.css?v=d110156a3798">
<link rel="stylesheet" href="css/mlnwp.css?v=d110156a3798">
<link rel="stylesheet" href="css/cartas.css?v=d110156a3798">
<link rel="stylesheet" href="css/sngr.css?v=d110156a3798">
<link rel="stylesheet" href="css/geoglows.css?v=d110156a3798">
<link rel="stylesheet" href="css/datos.css?v=d110156a3798">
<link rel="stylesheet" href="css/configuracion.css?v=d110156a3798">
<link rel="stylesheet" href="css/clima.css?v=d110156a3798">
<link rel="stylesheet" href="css/decisiones.css?v=d110156a3798">
</head>
<body>
<div id="capa-app">
  <aside id="sidebar">
    <div class="marca">
      <div class="marca-logo">HM</div>
      <div class="marca-texto">
        <span class="marca-nombre">HidroMet</span>
        <span class="marca-sub">Ecuador · Operativo</span>
      </div>
    </div>
    <nav id="nav-principal"></nav>
    <div class="sidebar-pie">
      <div id="tareas-activas"></div>
      <div class="sidebar-estado">
        <span class="punto"></span>
        <div class="et"><b>Sistema autocontenido</b><span>offline</span></div>
      </div>
      <button id="btn-tema" class="boton-fantasma" title="Alternar tema claro / oscuro">◐ Tema</button>
    </div>
  </aside>
  <main id="contenedor-vista">
    <div id="topbar">
      <button id="btn-menu" type="button" aria-label="Abrir menú" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="ruta">
        <span class="actual">Estación de trabajo</span><span class="sep">/</span><span id="topbar-modulo">Inicio</span>
      </div>
      <div class="estado">
        <div class="sync"><span class="punto"></span><span id="topbar-sync">Datos locales</span></div>
        <div class="reloj" id="topbar-reloj">—</div>
      </div>
    </div>
    <header id="cabecera-vista">
      <h1 id="titulo-vista">…</h1>
      <div id="acciones-vista"></div>
    </header>
    <section id="vista"></section>
  </main>
  <div id="overlay-nav"></div>
</div>
<div id="avisos"></div>

<script src="lib/leaflet/leaflet.js"></script>
<script src="lib/leaflet/leaflet.markercluster.js"></script>
<script src="lib/plotly/plotly.min.js"></script>
<script src="js/core.js?v=d110156a3798"></script>
<script src="js/modules/mlnwp.js?v=d110156a3798"></script>
<script src="js/modules/cartas.js?v=d110156a3798"></script>
<script src="js/modules/sngr.js?v=d110156a3798"></script>
<script src="js/modules/geoglows.js?v=d110156a3798"></script>
<script src="js/modules/clima.js?v=d110156a3798"></script>
<script src="js/modules/glosario.js?v=d110156a3798"></script>
<script src="js/modules/decisiones.js?v=d110156a3798"></script>
<script>App.iniciar();</script>
</body>
</html>
